name: Generate Angular migration
on:
  push:
    branches:
      - feature/tb2-code-quality-security
permissions:
  contents: read
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Check legacy dynamic platform usage
        run: |
          if grep -R -n '@angular/platform-browser-dynamic' src --include='*.ts'; then
            echo 'Legacy platform imports require migration before removal'
            exit 1
          fi
          npm uninstall @angular/platform-browser-dynamic --ignore-scripts
      - name: Migrate Angular 19 to 20
        run: npx ng update @angular/core@20 @angular/cli@20 @angular/cdk@20 @angular/common@20 @angular/compiler@20 @angular/compiler-cli@20 @angular/forms@20 @angular/platform-browser@20 @angular/router@20 @angular-devkit/build-angular@20 --allow-dirty
      - name: Format migrated source
        run: npm run format
      - name: Export changed files
        run: |
          python3 - <<'PY'
          import subprocess, pathlib, base64, json
          files = subprocess.check_output(['git','diff','--name-only','-z','HEAD']).decode().split('\0')
          files += subprocess.check_output(['git','ls-files','--others','--exclude-standard','-z']).decode().split('\0')
          files = sorted(set(filter(None,files)))
          print('MIGRATION_FILES', json.dumps(files))
          for i,name in enumerate(files):
              p=pathlib.Path(name)
              if not p.is_file():
                  print('MIGRATION_DELETE',i)
                  continue
              data=base64.b64encode(p.read_bytes()).decode()
              for j in range(0,len(data),6000):
                  print('MIGRATION_DATA',i,j,data[j:j+6000])
              print('MIGRATION_END',i,len(data))
          PY
      - name: Run tests
        run: npm run test:ci
      - name: Build
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=low
