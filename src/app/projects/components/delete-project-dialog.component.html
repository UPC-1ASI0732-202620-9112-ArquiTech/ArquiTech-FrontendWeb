<section class="dialog" aria-labelledby="delete-project-title">
  <header class="dialog__header">
    <h2 id="delete-project-title" class="dialog__title">{{ 'projects.delete.title' | translate }}</h2>
  </header>
  <div class="dialog__body">
    <p>{{ 'projects.delete.warning' | translate }}</p>
    <p>
      <strong>{{ project.name }}</strong>
    </p>
    <label for="delete-project-name">{{ 'projects.delete.confirmName' | translate }}</label
    ><input
      id="delete-project-name"
      class="field__control"
      [(ngModel)]="name"
      [disabled]="submitting()"
      autocomplete="off"
    />
    @if (errorKey(); as error) {
      <p class="form-alert" role="alert">{{ error | translate }}</p>
    }
  </div>
  <footer class="dialog__footer">
    <button type="button" class="btn btn--secondary" [disabled]="submitting()" (click)="close()">
      {{ 'common.cancel' | translate }}</button
    ><button
      type="button"
      class="btn btn--danger"
      [disabled]="submitting() || name !== project.name"
      (click)="submit()"
    >
      {{ (submitting() ? 'common.saving' : 'common.delete') | translate }}
    </button>
  </footer>
</section>
