<form class="dialog" [formGroup]="form" (ngSubmit)="submit()" novalidate aria-labelledby="incident-dialog-title">
  <header class="dialog__header">
    <div>
      <h2 id="incident-dialog-title" class="dialog__title">
        {{ (isEdit ? 'incidents.form.editTitle' : 'incidents.form.createTitle') | translate }}
      </h2>
      <p class="dialog__subtitle">{{ 'incidents.form.subtitle' | translate }}</p>
    </div>
    <button type="button" class="icon-button" (click)="close()" [attr.aria-label]="'common.close' | translate">
      <lucide-icon name="x" [size]="20" aria-hidden="true" />
    </button>
  </header>

  <div class="dialog__body">
    @if (errorKey(); as error) {
      <div class="form-alert" role="alert">
        <lucide-icon name="circle-alert" [size]="16" aria-hidden="true" />
        <span>{{ error | translate }}</span>
      </div>
    }

    <div class="form-grid">
      <div class="field">
        <label class="field__label" for="incident-type">{{ 'incidents.fields.type' | translate }}</label>
        <select id="incident-type" class="field__control" formControlName="type">
          <option value="" disabled>{{ 'incidents.fields.typePlaceholder' | translate }}</option>
          @for (type of types; track type) {
            <option [value]="type">{{ 'incidents.types.' + type | translate }}</option>
          }
        </select>
        <app-field-error [control]="form.controls.type" />
      </div>
      <div class="field">
        <label class="field__label" for="incident-date">{{ 'incidents.fields.reportedAt' | translate }}</label>
        <input id="incident-date" type="date" class="field__control" formControlName="reportedAt" [max]="today" />
        <app-field-error [control]="form.controls.reportedAt" />
      </div>

      <fieldset class="field field--full severity">
        <legend class="field__label">{{ 'incidents.fields.severity' | translate }}</legend>
        <div class="severity__options">
          @for (severity of severities; track severity) {
            <label [class]="'severity__option severity__option--' + severity.toLowerCase()">
              <input type="radio" formControlName="severity" [value]="severity" />
              <span>{{ 'incidents.severity.' + severity | translate }}</span>
            </label>
          }
        </div>
      </fieldset>

      <div class="field field--full">
        <label class="field__label" for="incident-description">{{ 'incidents.fields.description' | translate }}</label>
        <textarea
          id="incident-description"
          class="field__control"
          formControlName="description"
          rows="4"
          [placeholder]="'incidents.fields.descriptionPlaceholder' | translate"
        ></textarea>
        <app-field-error [control]="form.controls.description" />
      </div>

      <div class="field">
        <label class="field__label" for="incident-status">{{ 'common.status' | translate }}</label>
        <select id="incident-status" class="field__control" formControlName="status">
          @for (status of statuses; track status) {
            <option [value]="status">{{ 'incidents.status.' + status | translate }}</option>
          }
        </select>
      </div>
    </div>
  </div>

  <footer class="dialog__footer">
    <button type="button" class="btn btn--secondary" (click)="close()">{{ 'common.cancel' | translate }}</button>
    <button type="submit" class="btn btn--save" [disabled]="submitting()">
      <lucide-icon name="check" [size]="16" aria-hidden="true" />
      {{ (submitting() ? 'common.saving' : isEdit ? 'common.saveChanges' : 'incidents.form.submit') | translate }}
    </button>
  </footer>
</form>
